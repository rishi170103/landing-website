<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scartch todo list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>TODO LIST</h1>
    <hr/>
    <div class="input"> <input type="text" id="input">
    <button onclick="addItem()">add</button>
    </div>
    
    <div>
        <ul id="listContainer">
        <li>Hello
            <button onclick="deletebutton(event)">deletebutton</button>
        </li>
    </ul>
    </div>
    
    <script>
         //selecting listcontainer ul
         var ul=document.getElementById("listContainer")
         var box=document.getElementById("input")

        function addItem()
        {
            var listitem=document.createElement("li")
            listitem.innerHTML=box.value+"     <button onclick='deletebutton(event)'>deletebutton</buuton>"
            ul.append(listitem)
        }
        function deletebutton()
        {
            event.target.parentElement.remove()
        }
    </script>
</body>
</html>
